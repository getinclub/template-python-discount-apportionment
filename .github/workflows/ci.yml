name: Exact discount allocation contract
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: discount-apportionment-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q allocation.py monitor.py test_allocation.py
      - name: Run visible acceptance tests
        run: python -m pytest -v
      - name: Replay synthetic incident
        run: python monitor.py
